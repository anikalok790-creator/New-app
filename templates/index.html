<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapPro Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-body: #FFFFFF; --bg-surface: #F2F2F2; --text-main: #0F0F0F; --text-muted: #606060; --border-color: #E5E5E5; --primary: #FACC15; --black: #0F0F0F; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 50px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-top: 56px; padding-bottom: 60px; -webkit-user-select: none; user-select: none; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background: var(--bg-body); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .logo-icon { color: var(--primary); background: var(--black); width: 26px; height: 26px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; }
        .main-container { width: 100%; max-width: 600px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.2s ease; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .search-section { padding: 12px 16px; }
        .search-box { display: flex; align-items: center; background: var(--bg-surface); border-radius: var(--radius-pill); padding: 4px 6px 4px 16px; border: 1px solid transparent; }
        .search-box:focus-within { background: var(--bg-body); border-color: var(--border-color); }
        .search-box input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; padding: 10px 0; font-size: 1rem; color: var(--text-main); }
        .btn-paste { background: transparent; border: none; color: var(--text-muted); width: 36px; height: 36px; cursor: pointer; }
        .btn-search { background: var(--black); color: var(--primary); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        #videoFeed { padding: 0 0 20px 0; display: none; }
        .feed-card { margin-bottom: 24px; }
        .feed-video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; cursor: pointer; }
        .feed-video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .audio-feed-wrapper { padding: 20px; background: var(--bg-surface); text-align: center; }
        .audio-feed-wrapper audio { width: 100%; margin-top: 10px; }
        .feed-info { display: flex; gap: 12px; padding: 12px 16px; }
        .feed-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--black); color: var(--primary); display: flex; justify-content: center; align-items: center; font-weight: 700; }
        .feed-text { flex: 1; overflow: hidden; }
        .feed-text h3 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .feed-text p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .feed-actions { display: flex; flex-direction: column; gap: 15px; }
        .feed-more, .feed-delete { color: var(--text-muted); cursor: pointer; }
        #emptyState { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 190px); text-align: center; }
        .radar-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .ring { position: absolute; border: 2px solid rgba(250, 204, 21, 0.2); border-radius: 50%; animation: pulseRing 3s infinite; opacity: 0; }
        @keyframes pulseRing { 0% { width: 60px; height: 60px; opacity: 0.8; } 100% { width: 200px; height: 200px; opacity: 0; } }
        .main-icon-box { z-index: 10; width: 90px; height: 90px; background: rgba(255, 255, 255, 0.7); border-radius: 24px; display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .main-icon-box i { font-size: 2.5rem; color: var(--black); }
        .video-card { display: none; padding-bottom: 16px; }
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .thumb-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .time-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; }
        .video-details { padding: 12px 16px 0; }
        .tabs { display: flex; margin: 16px 16px 0; border-bottom: 1px solid var(--border-color); }
        .tab { flex: 1; text-align: center; padding: 12px 0; font-weight: 600; color: var(--text-muted); cursor: pointer; }
        .tab.active { color: var(--text-main); border-bottom: 2px solid var(--black); }
        .download-list { padding: 0 16px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); }
        .quality-tag { font-weight: 700; min-width: 55px; }
        .item-meta { display: flex; flex-direction: column; }
        .item-meta span { font-size: 0.75rem; color: var(--text-muted); }
        .btn-dl { background: var(--bg-surface); border: none; padding: 8px 14px; border-radius: var(--radius-pill); font-weight: 600; cursor: pointer; }
        .page-header { padding: 16px; font-weight: 700; display: flex; justify-content: space-between; }
        .btn-clear { background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; }
        .history-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .history-item { display: flex; gap: 12px; align-items: center; }
        .history-thumb { width: 130px; height: 73px; border-radius: var(--radius-md); object-fit: cover; background: #000; }
        .history-details { flex: 1; overflow: hidden; }
        .history-details h4 { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-details p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .history-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-history-dl, .btn-history-del { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: var(--bg-body); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.6rem; cursor: pointer; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--text-main); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: var(--bg-body); padding: 20px; border-radius: var(--radius-lg); width: 85%; max-width: 340px; text-align: center; }
        .progress-track { width: 100%; height: 6px; background: var(--bg-surface); border-radius: 3px; margin: 15px 0; }
        .progress-fill { height: 100%; width: 0%; background: var(--black); transition: width 0.3s; }
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--black); color: white; padding: 12px 24px; border-radius: var(--radius-pill); opacity: 0; transition: 0.3s; z-index: 10000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>SnapPro</div>
    </div>
    <div class="main-container">
        <div id="homePage" class="page active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="urlInput" placeholder="Paste video link here...">
                    <button class="btn-paste" onclick="pasteLink()"><i class="fa-regular fa-clipboard"></i></button>
                    <button class="btn-search" id="searchBtn" onclick="fetchInfo()"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            <div id="videoFeed"></div>
            <div id="emptyState">
                <div class="radar-container"><div class="ring"></div><div class="main-icon-box"><i class="fa-solid fa-arrow-down"></i></div></div>
                <h3>Ready to Download</h3><p>Paste a link above to get started.</p>
            </div>
            <div id="videoInfo" class="video-card">
                <div class="thumb-wrapper"><img id="vThumb" src=""><span id="vDuration" class="time-badge"></span></div>
                <div class="video-details"><h3 id="vTitle"></h3><p id="vUploader" style="font-size:0.8rem; color:var(--text-muted);"></p></div>
            </div>
            <div class="tabs" id="formatTabs" style="display:none;">
                <div class="tab active" onclick="switchTab('video', this)">Video</div>
                <div class="tab" onclick="switchTab('audio', this)">Audio</div>
            </div>
            <div id="formatList" class="download-list"></div>
        </div>
        <div id="downloadsPage" class="page">
            <div class="page-header"><span>History</span><button class="btn-clear" onclick="clearHistory()">Clear All</button></div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="switchPage('downloads', this)"><i class="fa-solid fa-clock-rotate-left"></i>History</div>
    </div>
    <div id="progressModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Downloading...</h3>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <p id="modalSubtitle" style="font-size:0.8rem; color:var(--text-muted);">Connecting...</p>
        </div>
    </div>
    <div id="toast" class="toast"><span id="toastMsg"></span></div>

    <script>
        const APP_SECRET_TOKEN = "{{ token }}";
        const originalFetch = window.fetch;
        window.fetch = function(url, options = {}) {
            if (url.includes('/api/') && !url.includes('/api/stream/') && !url.includes('/api/get-file/')) {
                if (!options.headers) options.headers = {};
                options.headers['X-App-Token'] = APP_SECRET_TOKEN;
            }
            return originalFetch(url, options);
        };

        let cFormats = [], cTitle = "", cThumb = "", cUploader = "", cUrl = "", cDesc = "";

        document.addEventListener("DOMContentLoaded", () => { loadHome(); });

        function toast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 3000); }
        function pasteLink() { navigator.clipboard.readText().then(t => document.getElementById('urlInput').value = t).catch(()=>toast("Clipboard blocked")); }
        function switchPage(p, el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.page').forEach(n => n.classList.remove('active')); document.getElementById(p+'Page').classList.add('active'); if(p==='downloads') loadHistory(); if(p==='home') loadHome(); }

        async function loadHome() {
            const feed = document.getElementById('videoFeed'), empty = document.getElementById('emptyState');
            try {
                const res = await fetch('/api/local-videos'); const data = await res.json();
                if(data.length === 0) { feed.style.display = 'none'; empty.style.display = 'flex'; return; }
                feed.style.display = 'block'; empty.style.display = 'none'; feed.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div'); card.className = 'feed-card';
                    const isAudio = item.resolution === 'Audio' || item.filename.endsWith('.m4a') || item.filename.endsWith('.mp3');
                    let media = isAudio ? `<div class="audio-feed-wrapper"><i class="fa-solid fa-music fa-2x"></i><audio src="${item.url}" controls></audio></div>` 
                                        : `<div class="feed-video-wrapper"><video src="${item.url}" controls></video></div>`;
                    card.innerHTML = `${media}<div class="feed-info"><div class="feed-avatar">${item.uploader[0]}</div><div class="feed-text"><h3>${item.title}</h3><p>${item.resolution} • ${item.time}</p></div><div class="feed-actions"><div class="feed-delete" onclick="deleteVideo('${item.filename}')"><i class="fa-solid fa-trash"></i></div></div></div>`;
                    feed.appendChild(card);
                });
            } catch(e) { empty.style.display = 'flex'; }
        }

        async function deleteVideo(fname) {
            if(!confirm('Delete this file?')) return;
            await fetch('/api/delete-video', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: fname}) });
            toast("Deleted"); loadHome(); loadHistory();
        }

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return toast("Enter URL");
            document.getElementById('searchBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            document.getElementById('emptyState').style.display = 'none';
            try {
                const res = await fetch('/api/info', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url}) });
                const d = await res.json(); if(!res.ok) throw new Error(d.error);
                cTitle = d.title; cThumb = d.thumbnail; cUploader = d.uploader; cUrl = url; cDesc = d.description; cFormats = d.formats;
                document.getElementById('vThumb').src = d.thumbnail; document.getElementById('vTitle').innerText = d.title;
                document.getElementById('vDuration').innerText = d.duration; document.getElementById('vUploader').innerText = `${d.uploader} • ${d.views}`;
                document.getElementById('videoInfo').style.display = 'block'; document.getElementById('formatTabs').style.display = 'flex';
                document.querySelectorAll('.tab')[0].classList.add('active'); document.querySelectorAll('.tab')[1].classList.remove('active'); renderFormats('video');
            } catch(e) { toast(e.message); document.getElementById('emptyState').style.display = 'flex'; }
            finally { document.getElementById('searchBtn').innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>'; }
        }

        function switchTab(t, el) { document.querySelectorAll('.tab').forEach(n => n.classList.remove('active')); el.classList.add('active'); renderFormats(t); }

        function renderFormats(type) {
            const list = document.getElementById('formatList'); list.innerHTML = '';
            if(type === 'audio') {
                list.innerHTML = `<div class="list-item"><div class="quality-tag">Audio</div><div class="item-meta"><span>M4A Format</span></div><button class="btn-dl" onclick="startDL('audio', this)"><i class="fa-solid fa-download"></i></button></div>`;
            } else {
                cFormats.forEach(f => {
                    const size = f.filesize ? (f.filesize/(1024*1024)).toFixed(1)+' MB' : 'Auto';
                    list.innerHTML += `<div class="list-item"><div class="quality-tag">${f.resolution}</div><div class="item-meta"><span>${f.ext.toUpperCase()} • ${size}</span></div><button class="btn-dl" onclick="startDL('${f.height}', this)"><i class="fa-solid fa-download"></i></button></div>`;
                });
            }
        }

        async function startDL(height, btn) {
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
            try {
                const res = await fetch('/api/start-download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: cUrl, height, title: cTitle, thumb: cThumb, uploader: cUploader, views: '', description: cDesc}) });
                const d = await res.json(); if(!res.ok) throw new Error(d.error);
                document.getElementById('progressModal').style.display = 'flex';
                const iv = setInterval(async () => {
                    const pr = await (await fetch(`/api/progress/${d.task_id}`)).json();
                    document.getElementById('progressFill').style.width = pr.percent + '%';
                    document.getElementById('modalSubtitle').innerText = `${pr.status.toUpperCase()} - ${pr.speed} MB/s`;
                    if(pr.status === 'done') {
                        clearInterval(iv);
                        // WEBTOAPP NATIVE DOWNLOAD TRIGGER
                        window.location.href = `/api/get-file/${d.task_id}`;
                        setTimeout(() => { document.getElementById('progressModal').style.display='none'; btn.innerHTML='<i class="fa-solid fa-download"></i>'; btn.disabled=false; loadHome(); }, 2000);
                    } else if(pr.status === 'error') {
                        clearInterval(iv); document.getElementById('progressModal').style.display='none'; toast("Error: "+pr.error); btn.innerHTML='<i class="fa-solid fa-download"></i>'; btn.disabled=false;
                    }
                }, 1000);
            } catch(e) { toast(e.message); btn.innerHTML='<i class="fa-solid fa-download"></i>'; btn.disabled=false; }
        }

        async function loadHistory() {
            const list = document.getElementById('historyList'); list.innerHTML = 'Loading...';
            const data = await (await fetch('/api/history')).json();
            if(data.length === 0) return list.innerHTML = 'No history.';
            list.innerHTML = '';
            data.forEach(i => {
                list.innerHTML += `<div class="history-item"><img src="${i.thumbnail}" class="history-thumb"><div class="history-details"><h4>${i.title}</h4><p>${i.resolution} • ${i.time}</p></div><div class="history-actions"><button class="btn-history-dl" onclick="window.location.href='/api/download-history-file/${i.task_id}'"><i class="fa-solid fa-download"></i></button><button class="btn-history-del" onclick="deleteVideo('${i.filename}')"><i class="fa-solid fa-trash"></i></button></div></div>`;
            });
        }

        async function clearHistory() {
            if(!confirm('Clear all history?')) return;
            await fetch('/api/clear-history', {method:'POST'}); loadHistory(); loadHome(); toast("Cleared");
        }
    </script>
</body>
</html>
